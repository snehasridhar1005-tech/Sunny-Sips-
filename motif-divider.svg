<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" width="200" height="40" role="presentation">
  <!-- Left smile line -->
  <path d="M 10 20 Q 50 28 80 20" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Center Sun Motif -->
  <g transform="translate(100, 20)">
    <circle cx="0" cy="0" r="9" fill="#FFC629"/>
    <!-- rays -->
    <path d="M 0 -14 L 0 -11" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 11 L 0 14" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -14 0 L -11 0" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 11 0 L 14 0" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -10 -10 L -8 -8" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 8 L 10 10" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -10 10 L -8 8" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 -8 L 10 -10" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- smile inside sun -->
    <path d="M -4 2 Q 0 5 4 2" stroke="#13301B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <circle cx="-3" cy="-1.5" r="0.9" fill="#13301B"/>
    <circle cx="3" cy="-1.5" r="0.9" fill="#13301B"/>
  </g>
  <!-- Right smile line -->
  <path d="M 120 20 Q 150 28 190 20" stroke="#FF941F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
