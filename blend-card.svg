<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="blend-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="blend-liq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#blend-bg)"/>

  <!-- Kiwi / Fruit Accents in Background -->
  <g transform="translate(100, 110)">
    <circle cx="0" cy="0" r="36" fill="#8BC34A" stroke="#558B2F" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#DCEDC8"/>
    <circle cx="0" cy="0" r="9" fill="#FFF9C4"/>
    <!-- Seeds -->
    <circle cx="-14" cy="-3" r="1.5" fill="#13301B"/>
    <circle cx="-10" cy="-10" r="1.5" fill="#13301B"/>
    <circle cx="0" cy="-14" r="1.5" fill="#13301B"/>
    <circle cx="10" cy="-10" r="1.5" fill="#13301B"/>
    <circle cx="14" cy="-3" r="1.5" fill="#13301B"/>
    <circle cx="12" cy="7" r="1.5" fill="#13301B"/>
    <circle cx="0" cy="14" r="1.5" fill="#13301B"/>
    <circle cx="-12" cy="7" r="1.5" fill="#13301B"/>
  </g>

  <!-- Tangerine Straw -->
  <path d="M 235 25 L 210 145" stroke="#FF941F" stroke-width="12" stroke-linecap="round"/>
  <line x1="233" y1="40" x2="225" y2="44" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="225" y1="65" x2="217" y2="69" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Takeaway Cup with Swirl Smoothie -->
  <path d="M 160 100 L 240 100 L 228 245 C 227 254 220 260 210 260 L 190 260 C 180 260 173 254 172 245 Z" fill="url(#blend-liq)"/>
  
  <!-- Swirl of creamy mango/banana layer -->
  <path d="M 166 140 Q 200 160 234 135 L 230 170 Q 200 190 170 170 Z" fill="#FFD54F" opacity="0.6"/>

  <path d="M 155 95 L 245 95 L 231 250 C 230 260 221 268 210 268 L 190 268 C 179 268 170 260 169 250 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.85"/>
  <ellipse cx="200" cy="95" rx="46" ry="10" fill="#FFFFFF" opacity="0.4"/>

  <!-- Whipped / frothy top -->
  <path d="M 160 95 Q 180 80 200 90 Q 220 80 240 95 Z" fill="#FFFDE7" opacity="0.7"/>

  <!-- Fruit garnish on top -->
  <circle cx="215" cy="85" r="9" fill="#FF7770"/>
  <path d="M 215 76 Q 220 70 225 74" stroke="#347B43" stroke-width="2" fill="none"/>

  <!-- Brand Smile on cup -->
  <circle cx="200" cy="180" r="16" fill="#FFF4DF"/>
  <circle cx="195" cy="177" r="1.5" fill="#13301B"/>
  <circle cx="205" cy="177" r="1.5" fill="#13301B"/>
  <path d="M 195 182 Q 200 187 205 182" stroke="#FF941F" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Floating Berries on right -->
  <circle cx="295" cy="165" r="14" fill="#E91E63"/>
  <circle cx="318" cy="185" r="11" fill="#9C27B0"/>
  <circle cx="285" cy="195" r="10" fill="#FF941F"/>

  <!-- Category Pill Badge -->
  <g transform="translate(200, 280)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#13301B"/>
    <text x="0" y="5" font-family="'Fredoka', sans-serif" font-weight="600" font-size="12" fill="#FFC629" text-anchor="middle">
      HAPPY BLENDS (BLENDED DRINKS)
    </text>
  </g>
</svg>
