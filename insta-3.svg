<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#E8F5E9"/>
  <!-- Study desk vibes -->
  <rect x="50" y="70" width="200" height="150" rx="10" fill="#FFF" stroke="#C8E6C9" stroke-width="4"/>
