  <line x1="70" y1="130" x2="180" y2="130" stroke="#C8E6C9" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="160" x2="150" y2="160" stroke="#C8E6C9" stroke-width="6" stroke-linecap="round"/>
