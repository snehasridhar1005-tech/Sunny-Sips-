<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="320" height="84" role="img" aria-label="Sunny Sips - On The Bright Side Logo">
  <defs>
    <!-- Warm Sun Glow -->
    <filter id="sunGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF941F" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE043"/>
      <stop offset="100%" stop-color="#FF941F"/>
    </linearGradient>
  </defs>

  <!-- Joyful Bubbly Sun with Rays (Top Left Accent) -->
  <g transform="translate(46, 26)">
    <!-- Sun Rays (bouncy, rounded) -->
    <path d="M 0 -19 L 0 -14" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0 14 L 0 19" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -19 0 L -14 0" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 14 0 L 19 0" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -13 -13 L -9.5 -9.5" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 9.5 9.5 L 13 13" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M -13 13 L -9.5 9.5" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 9.5 -9.5 L 13 -13" stroke="#FF941F" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Sun Disc -->
    <circle cx="0" cy="0" r="10.5" fill="url(#sunGrad)" filter="url(#sunGlow)"/>
    <!-- Sun Eyes & Smile -->
    <circle cx="-3.5" cy="-2" r="1.3" fill="#13301B"/>
    <circle cx="3.5" cy="-2" r="1.3" fill="#13301B"/>
    <path d="M -4 2 Q 0 5.5 4 2" stroke="#13301B" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Creative, Fun, Chunky Brand Wordmark -->
  <g transform="translate(82, 38)">
    <!-- Main bouncy title -->
    <text font-family="'Titan One', 'Fredoka', 'Chewy', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="28" fill="#13301B" letter-spacing="-0.5">
      Sunny <tspan fill="#347B43">Sips</tspan>
    </text>

    <!-- Subtitle "ON THE BRIGHT SIDE" in bold playful badge style -->
    <text x="2" y="19" font-family="'Fredoka', 'Quicksand', sans-serif" font-weight="700" font-size="10.5" fill="#FF941F" letter-spacing="1.5">
      ON THE BRIGHT SIDE ☀️
    </text>

    <!-- Warm Curved Smile Stroke Underneath -->
    <path d="M 2 28 Q 86 44 170 28" stroke="#FF941F" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <circle cx="2" cy="28" r="2.5" fill="#FF7770" />
    <circle cx="170" cy="28" r="2.5" fill="#FF7770" />
  </g>
</svg>
